<html>

  <head>

    <style>

      @font-face {
        font-family: "SanguineFrost";
        src: url("fonts/Sanguine Frost.ttf") format("truetype");
        /*font-weight: normal;*/
        /*font-style: normal; */
      }

      a {
        cursor: pointer;
        text-decoration: none;
      }

      html, body {
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        perspective: 1px;

        scroll-behavior: smooth;
      }

      body {
        width: 100%;
        background-color: black;
      }

      #page-header {
        width: 100%;
        color: white;
        background-color: rgb(0 0 0 / 0.85);
        text-align: center;
        display: inline-block;

        position: sticky;
        top: 0px;
        z-index: 10;

        margin: 0px 0px 0px 0px;

        opacity: 0.9
      }

      #page-header a:link, #page-header a:visited {
        color: white;
        margin: 0px 20px 0px 20px;
      }

      #page-header p {
        display: inline-block;

        font-family: "SanguineFrost", serif;
        font-size: 24pt;
      }

      #page-header p:hover {
        transition: opacity 0.25s ease-in-out;
        opacity: 0.8;
      }

      #page-header p:not(:hover) {
        transition: opacity 0.25s ease-in-out;
      }

      #page-content {
        padding-top: 100px;

        transform-style: preserve-3d;
        position: relative;
      }

      #page-content #background-img {
        display: block;
        position: absolute;
        width: 100%;
        top: 150px;
        left: 50%;

        transform: translateX(-50%) translateZ(-1px) scale(2);

        opacity: 0.20;
        filter: grayscale(60%);
        z-index: -1;
      }

      .band-logo {
        max-width: 90%;
        min-width: 70%;

        display: block;

        margin: 35px auto 65px auto;
      }

      .album {
        /*padding-top: 120px;*/
      }

      .album .cover {
        max-width: 60%;
        min-width: 40%;

        display: block;
        margin: auto;
      }

      .album .caption {
        color: white;
        text-align: center;

        margin: 20px 0px 20px 0px;
        font-family: "SanguineFrost", serif;
        font-size: 24pt;
      }

      .album #providers {
        width: 100%;
        display: inline-block;
        text-align: center;
      }

      #providers .provider-logo {
        margin: 12px 12px 12px 12px;
      }

      #providers #spotify-logo {
        width: 140px;
      }

      #providers #pandora-logo {
        width: 100px;
      }

      #providers #bandcamp-logo {
        width: 180px;
      }

      #providers #youtube-logo {
        width: 140px;
      }


      #social-section #services {
        width: 100%;
        display: inline-block;
        text-align: center;
      }

      #social-section .caption {
        color: white;
        text-align: center;

        margin: 20px 0px 20px 0px;
        font-family: "SanguineFrost", serif;
        font-size: 24pt;

        margin: 60px 60px 30px 60px;
      }

      #services .service-logo {
        margin: 0px 30px 0px 30px;
      }

      #services #facebook-logo {
        width: 60px;
      }

      #services #instagram-logo {
        width: 60px;
      }

      #services #x-logo {
        width: 60px;
      }

      #services #tiktok-logo {
        width: 60px;
      }

      #page-footer {
        width: auto;
        text-align: center;
      }

      #page-footer, #page-footer a, #page-footer a:visited  {
        width: auto;
        margin: 50px;
        margin-top: 75px;

        font-family: "SanguineFrost", serif;
        font-size: 20pt;

        color: white;
      }

    </style>

    <script>

      //document.addEventListener("DOMContentLoaded", (evt) => {
      //});

    </script>

  </head>

  <body>

    <div id="page-header">
      <a href="#music-section"><p>Music</p></a>
      <a href="#social-section"><p>Social</p></a>
      <a href="https://demonseed666.bandcamp.com/album/demonseed" target="_blank" rel="noopener noreferrer"><p>Merch</p></a>
    </div>

    <div id="page-content">
      <img id="background-img" src="img/gangster_logo_trans.png"/>
      <img class="band-logo" src="img/demonseed-logo-black-over-white.png"/>

      <div id="music-section" class="album">
        <img class="cover" src="img/2026-album-cover-BWnR.png"/>
        <p class="caption">New Album OUT NOW on</p>

        <div id="providers">
          <a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer"><img id="spotify-logo" class="provider-logo" src="img/Spotify_Full_Logo_RGB_Green.png"/></a>
          <a href="https://www.pandora.com/" target="_blank" rel="noopener noreferrer"><img id="pandora-logo" class="provider-logo" src="img/pandora-logo-trans.png"/></a>
          <a href="https://demonseed666.bandcamp.com/album/demonseed" target="_blank" rel="noopener noreferrer"><img id="bandcamp-logo" class="provider-logo" src="img/bandcamp-logo-vector.png"/></a>
          <a href="https://www.youtube.com/watch?v=ICszPaKJOJM&list=RDICszPaKJOJM" target="_blank" rel="noopener noreferrer"><img id="youtube-logo" class="provider-logo" src="img/youtube-logo-trans.png"/></a>
        </div>

      </div>

      <div id="social-section">
        <p class="caption">Social Media</p>

        <div id="services">
          <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer"><img id="facebook-logo" class="service-logo" src="img/facebook-logo-trans.png"/></a>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><img id="instagram-logo" class="service-logo" src="img/instragram-logo-trans.jpg"/></a>
          <a href="https://x.com/" target="_blank" rel="noopener noreferrer"><img id="x-logo" class="service-logo" src="img/x-logo-black-trans.png"/></a>
          <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer"><img id="tiktok-logo" class="service-logo" src="img/tiktok-logo-transparent.jpg"/></a>
        </div>

      </div>

    </div>

    <div id="page-footer">
      <a href="mailto:contact@demonseedsouthside.com">contact@demonseedsouthside.com</a>
    </div>

  </body>

</html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Demonseed Southside</title>

    <style>

      @font-face {
        font-family: "Rademos";
        src: url("fonts/Rademos.ttf") format("truetype");
        /*font-weight: normal;*/
        /*font-style: normal; */
      }

      a {
        cursor: pointer;
        text-decoration: none;
      }

      html, body {
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        perspective: 1px;

        scroll-behavior: smooth;

        min-width: 800px;
      }

      body {
        width: 100%;
        background-color: black;
      }

      #page-header {
        width: 100%;
        color: white;
        background-color: rgb(0 0 0 / 0.85);
        text-align: center;
        display: inline-block;

        position: sticky;
        top: 0px;
        z-index: 10;

        margin: 0px 0px 0px 0px;

        opacity: 0.9
      }

      #page-header a:link, #page-header a:visited {
        color: white;
        margin: 0px 20px 0px 20px;
      }

      #page-header p {
        display: inline-block;

        font-family: "Rademos", serif;
        font-size: 36pt;

        margin: 15px 0px 15px 0px;

        transform: scaleX(1.25);
        transform-origin: center;
      }

      #page-header p:hover {
        transition: opacity 0.25s ease-in-out;
        opacity: 0.8;
      }

      #page-header p:not(:hover) {
        transition: opacity 0.25s ease-in-out;
      }

      #page-content {
        padding-top: 100px;

        transform-style: preserve-3d;
        position: relative;
      }

      #releases-section, #social-section {
        scroll-margin-top: 100px;
      }

      #page-content #background-img {
        display: block;
        position: absolute;
        width: 100%;
        top: 150px;
        left: 50%;

        transform: translateX(-50%) translateZ(-1px) scale(2);

        opacity: 0.20;
        filter: grayscale(60%);
        z-index: -10;
      }

      .band-logo {
        max-width: 90%;
        min-width: 70%;

        display: block;

        margin: 35px auto 65px auto;
        /*filter: brightness(20) invert(0);*/
        filter: brightness(10) saturate(0);
      }

      .album {
        /*padding-top: 120px;*/
      }

      .album .cover {
        max-width: 60%;
        min-width: 40%;

        display: block;
        margin: auto;
        margin: auto auto 60px auto;
      }

      .album .caption {
        color: white;
        text-align: center;

        margin: 20px 0px 40px 0px;
        font-family: "Rademos", serif;
        font-size: 36pt;

        transform: scaleX(1.5);
        transform-origin: center;
      }

      .album #providers {
        width: 100%;
        display: inline-block;
        text-align: center;
      }

      #providers .provider-logo {
        margin: 12px 12px 12px 12px;
      }

      #providers #spotify-logo {
        width: 140px;
      }

      #providers #pandora-logo {
        width: 100px;
      }

      #providers #bandcamp-logo {
        width: 180px;
      }

      #providers #youtube-logo {
        width: 140px;
      }

      #social-section #services {
        width: 100%;
        display: inline-block;
        text-align: center;
      }

      #social-section .caption {
        color: white;
        text-align: center;

        font-family: "Rademos", serif;
        font-size: 32pt;

        transform: scaleX(1.5);
        transform-origin: center;

        margin: 72px 60px 48px 60px;
      }

      #services .service-logo {
        margin: 0px 30px 0px 30px;

        width: 60px;
      }
/*
      #services #facebook-logo {
        width: 60px;
      }

      #services #instagram-logo {
        width: 60px;
      }

      #services #x-logo {
        width: 60px;
      }

      #services #tiktok-logo {
        width: 60px;
      }
*/
      #page-footer {
        position: relative;

        width: auto;
        text-align: center;

        margin: 130px 50px 50px 50px;
      }

      #page-footer, #page-footer a, #page-footer a:visited  {
        color: white;
      }

      #page-footer .caption {
        letter-spacing: 5px;

        font-family: "Rademos", serif;
        font-size: 32pt;

      }

/*      #page-footer .caption h4, #page-footer .caption h4 a {
      }*/


    </style>

    <script>

      let arriveTimestamp, leaveTimestamp, destination;

      document.addEventListener("DOMContentLoaded", (evt) => {
        arriveTimestamp = Date.now();
        destination = null;
      });

      document.addEventListener("visibilitychange", () => {

        if (document.visibilityState === "hidden") {
          leaveTimestamp = Date.now();

          const data = {
            start: arriveTimestamp,
            end: leaveTimestamp,
            dest: destination
          };

          const payload = {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify(data),
          };

          fetch('http://localhost:3000/api/visitor', payload)
            .catch((error) => {
              // fail silently
              console.debug('WARNING: stats endpoint failure.', error);
            });

        } else if (document.visibilityState === "visible") {
          destination = null;
          arriveTimestamp = Date.now();
        }

      });

    </script>

  </head>

  <body>

    <div id="page-header">
      <a href="#releases-section"><p>Releases</p></a>
      <a href="#social-section"><p>Social</p></a>
      <a href="https://demonseed666.bandcamp.com/album/demonseed" target="_blank" rel="noopener noreferrer"><p>Merch</p></a>
    </div>

    <div id="page-content">
      <img id="background-img" src="img/gangster_logo_trans.jpg"/>
      <img class="band-logo" src="img/demonseed-logo-red.png"/>

      <div id="releases-section" class="album">
        <p class="caption">New Album OUT NOW!</p>
        <img class="cover" src="img/2026-album-cover-BWnR.png"/>
        <p class="caption">Now Streaming On</p>

        <div id="providers">
          <a href="https://open.spotify.com/" onclick="destination=this.href;" target="_blank" rel="noopener noreferrer"><img id="spotify-logo" class="provider-logo" title="Spotify" src="img/Spotify_Full_Logo_RGB_Green.png"/></a>
          <a href="https://www.pandora.com/" onclick="destination=this.href;" target="_blank" rel="noopener noreferrer"><img id="pandora-logo" class="provider-logo" title="Pandora" src="img/pandora-logo-trans.png"/></a>
          <a href="https://demonseed666.bandcamp.com/album/demonseed" onclick="destination=this.href;" target="_blank" rel="noopener noreferrer"><img id="bandcamp-logo" class="provider-logo" title="Bandcamp" src="img/bandcamp-logo-vector.png"/></a>
          <a href="https://www.youtube.com/watch?v=ICszPaKJOJM&list=RDICszPaKJOJM" onclick="destination=this.href;" target="_blank" rel="noopener noreferrer"><img id="youtube-logo" class="provider-logo" title="Youtube" src="img/youtube-logo-trans.png"/></a>
        </div>

      </div>

      <div id="social-section">
        <p class="caption">Social Media</p>

        <div id="services">
          <a href="https://www.facebook.com/" onclick="destination=this.href;" target="_blank" rel="noopener noreferrer"><img id="facebook-logo" class="service-logo" title="Facebook" src="img/Facebook_Logo_2023.png"/></a>
          <a href="https://www.instagram.com/" onclick="destination=this.href;" target="_blank" rel="noopener noreferrer"><img id="instagram-logo" class="service-logo" title="Instagram" src="img/Instagram_Glyph_Gradient.png"/></a>
          <a href="https://x.com/" onclick="destination=this.href;" target="_blank" rel="noopener noreferrer"><img id="x-logo" class="service-logo" title="X" src="img/x-logo-black-trans.png"/></a>
          <a href="https://www.tiktok.com/" onclick="destination=this.href;" target="_blank" rel="noopener noreferrer"><img id="tiktok-logo" class="service-logo" title="Tiktok" src="img/tiktok-circle-white-icon.png"/></a>
        </div>

      </div>

    </div>

    <div id="page-footer">

      <div class="caption">
        <a href="mailto:contact@demonseedsouthside.com">contact@demonseedsouthside.com</a>

      </div>

    </div>

  </body>

</html>
